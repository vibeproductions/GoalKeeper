name: Discord Release Notifier
on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # 1. This step downloads your code history so the builder can see the commits
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. This step generates the list of changes
      - name: Build Changelog from Commits
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          # Explicitly force commit mode before reading JSON
          mode: 'COMMIT' 
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "categories": [
                {
                  "title": "## 📝 Changes",
                  "labels": ["*"]
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. This step sends the formatted list to Discord
      - name: Send Release to Discord
        run: |
          cat << 'EOF' > changelog.txt
          ${{ steps.build_changelog.outputs.changelog }}
          EOF
          
          CONTENT=$(cat changelog.txt)
          CLEAN_CONTENT=$(echo "$CONTENT" | sed 's/"/\\"/g')

          curl -H "Content-Type: application/json" \
          -X POST -d "{
            \"embeds\": [{
              \"title\": \"🚀 New Update: ${{ github.event.release.name }}\",
              \"url\": \"${{ github.event.release.html_url }}\",
              \"description\": \"$CLEAN_CONTENT\",
              \"color\": 3447003
            }]
          }" ${{ secrets.DISCORD_WEBHOOK_URL }}
