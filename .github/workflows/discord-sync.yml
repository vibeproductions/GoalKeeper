name: Discord Release Notifier
on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Commit Log
        id: changelog
        uses: metcalfc/changelog-generator@v4.3.1
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Update GitHub Release Page
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## Changes in this release
            ${{ steps.changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send to Discord
        run: |
          # Use a variable for the content and clean up quotes
          CONTENT="## Changes in this release\n${{ steps.changelog.outputs.changelog }}"
          CLEAN_CONTENT=$(echo "$CONTENT" | sed 's/"/\\"/g')

          curl -H "Content-Type: application/json" \
          -X POST -d "{
            \"embeds\": [{
              \"title\": \"New Update: ${{ github.event.release.name }}\",
              \"url\": \"${{ github.event.release.html_url }}\",
              \"description\": \"$CLEAN_CONTENT\",
              \"color\": 3447003
            }]
          }" ${{ secrets.DISCORD_WEBHOOK_URL }}
