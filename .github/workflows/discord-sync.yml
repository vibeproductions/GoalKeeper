name: Discord Release Notifier
on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: Gives the script permission to edit the release page
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Changelog from Commits
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          commitMode: true
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "categories": [
                {
                  "title": "## 📝 Changes",
                  "labels": ["*"]
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update GitHub Release Page
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.build_changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send to Discord
        run: |
          # We pull the CLEAN output directly from the builder step
          CONTENT="${{ steps.build_changelog.outputs.changelog }}"
          CLEAN_CONTENT=$(echo "$CONTENT" | sed 's/"/\\"/g')

          curl -H "Content-Type: application/json" \
          -X POST -d "{
            \"embeds\": [{
              \"title\": \"🚀 New Update: ${{ github.event.release.name }}\",
              \"url\": \"${{ github.event.release.html_url }}\",
              \"description\": \"$CLEAN_CONTENT\",
              \"color\": 3447003
            }]
          }" ${{ secrets.DISCORD_WEBHOOK_URL }}
