name: Discord Release Notifier
on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # 1. Download the full git history so we can see the commits
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Build the list of changes using Commit Mode
      - name: Build Changelog from Commits
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          commitMode: true
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "categories": [
                {
                  "title": "## Changes in this release",
                  "labels": ["*"]
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Send the list to your Discord channel
      - name: Send Release to Discord
        run: |
          # Use a heredoc to handle multi-line text safely
          cat << 'EOF' > changelog.txt
          ${{ steps.build_changelog.outputs.changelog }}
          EOF
          
          CONTENT=$(cat changelog.txt)
          
          # Escape any double quotes in commit messages so they don't break the JSON
          CLEAN_CONTENT=$(echo "$CONTENT" | sed 's/"/\\"/g')

          curl -H "Content-Type: application/json" \
          -X POST -d "{
            \"embeds\": [{
              \"title\": \"🚀 New Update: ${{ github.event.release.name }}\",
              \"url\": \"${{ github.event.release.html_url }}\",
              \"description\": \"$CLEAN_CONTENT\",
              \"color\": 3447003
            }]
          }" ${{ secrets.DISCORD_WEBHOOK_URL }}
