name: Discord Release Notifier
on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Commits and Sanitize
        id: get_commits
        run: |
          LATEST_TAG=${{ github.event.release.tag_name }}
          PREVIOUS_TAG=$(git describe --abbrev=0 --tags $LATEST_TAG^ 2>/dev/null || echo "")
          
          if [ -z "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log -n 10 --pretty=format:"- %s")
          else
            COMMITS=$(git log $PREVIOUS_TAG..$LATEST_TAG --pretty=format:"- %s")
          fi
          
          # Use printf to safely pass the raw commit string to jq
          JSON_COMMITS=$(printf '%s' "$COMMITS" | jq -R -s '.')
          
          # Quoted GITHUB_OUTPUT for maximum safety
          echo "list=$JSON_COMMITS" >> "$GITHUB_OUTPUT"

      - name: Post to Discord
        run: |
          # Build the payload using JQ
          PAYLOAD=$(jq -n \
            --arg title "New Update: ${{ github.event.release.name }}" \
            --argjson desc '${{ steps.get_commits.outputs.list }}' \
            --arg url "${{ github.event.release.html_url }}" \
            '{embeds: [{title: $title, description: $desc, url: $url, color: 3447003}]}')

          # Use --fail-with-body to catch Discord errors visibly
          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
