name: Discord Release Notifier
on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Build Changelog from Commits
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          # Explicitly set commit mode here and in the JSON
          configurationJson: |
            {
              "mode": "COMMIT",
              "template": "#{{CHANGELOG}}",
              "categories": [
                {
                  "title": "## 📝 Commit Changes",
                  "labels": ["*"]
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Release to Discord
        run: |
          # We use a heredoc to handle multi-line changelog content safely
          cat << 'EOF' > changelog.txt
          ${{ steps.build_changelog.outputs.changelog }}
          EOF
          
          CONTENT=$(cat changelog.txt)
          
          # Clean up any quotes that might break the JSON payload
          CLEAN_CONTENT=$(echo "$CONTENT" | sed 's/"/\\"/g')

          curl -H "Content-Type: application/json" \
          -X POST -d "{
            \"embeds\": [{
              \"title\": \"🚀 New Update: ${{ github.event.release.name }}\",
              \"url\": \"${{ github.event.release.html_url }}\",
              \"description\": \"$CLEAN_CONTENT\",
              \"color\": 3447003
            }]
          }" ${{ secrets.DISCORD_WEBHOOK_URL }}
