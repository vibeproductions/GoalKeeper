name: goalkeeper
description: AI-powered goal and assignment tracker
version: 1.0.5+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
    

  # State management (equivalent to @EnvironmentObject / ObservableObject)
  provider: ^6.1.1

  # Persistent storage (equivalent to UserDefaults)
  shared_preferences: ^2.2.2

  # Secure storage (equivalent to Keychain)
  flutter_secure_storage: ^9.0.0

  # HTTP requests (Anthropic API)
  http: ^1.2.0

  # File picker (equivalent to NSOpenPanel)
  file_picker: ^8.0.3

  # Image picking
  image_picker: ^1.0.7

  # Window management (title bar, sizing)
  window_manager: ^0.3.8

  # URL launching (open links in browser)
  url_launcher: ^6.2.4

  # JSON serialization helpers
  json_annotation: ^4.8.1

  # Path utilities
  path: ^1.9.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  
  # For iOS System Themes
  image_path_ios_dark_transparent: "assets/icon/icon_dark.png"
  image_path_ios_tinted_grayscale: "assets/icon/icon_tinted.png"

  # macOS Desktop Build Activation
  macos:
    generate: true                  # <-- Activates macOS builds
    image_path: "assets/icon/icon.png"

  # For Android Dynamic / Themed Icons
  adaptive_icon_background: "#1A1A1A" # Matches your dark palette
  adaptive_icon_foreground: "assets/icon/icon_dark.png"
  adaptive_icon_monochrome: "assets/icon/icon_tinted.png"

flutter:
  uses-material-design: true

  fonts:
    - family: Geist
      fonts:
        - asset: fonts/Geist-Regular.ttf
          weight: 400
        - asset: fonts/Geist-Medium.ttf
          weight: 500
        - asset: fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: fonts/Geist-Bold.ttf
          weight: 700

    - family: DMSans
      fonts:
        - asset: fonts/DMSans-Regular.ttf
          weight: 400
        - asset: fonts/DMSans-Medium.ttf
          weight: 500
        - asset: fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: fonts/DMSans-Bold.ttf
          weight: 700

